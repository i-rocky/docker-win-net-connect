name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -o "dist/docker-win-net-connect.exe" .
          ZIP="docker-win-net-connect-windows-x86_64-${VERSION}.zip"
          (cd dist && zip -9 "$ZIP" docker-win-net-connect.exe)

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd dist && find . -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
